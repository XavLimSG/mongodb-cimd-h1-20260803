<!doctype html><meta charset="utf-8"><title>Gateway Network Test</title><h1>Gateway Network Test</h1><pre id="o">Running...</pre><script>
(async()=>{
"use strict";
const q=new URLSearchParams(location.search);const start=Math.max(1,Number(q.get("start")||1));const end=Math.min(65535,Number(q.get("end")||4096));const batchSize=32;const quickTimeout=300;const candidates=[];let tested=0;
function probe(port,timeoutMs){const url=`http://localhost:${port}/favicon.ico?r=${Math.random()}`;const began=performance.now();return new Promise(resolve=>{let done=false;const finish=state=>{if(done)return;done=true;resolve({p:port,s:state,t:Math.round(performance.now()-began)})};const controller=new AbortController();const timer=setTimeout(()=>{controller.abort();finish("timeout")},timeoutMs);fetch(url,{mode:"no-cors",cache:"no-store",signal:controller.signal}).then(()=>{clearTimeout(timer);finish("ok")}).catch(error=>{clearTimeout(timer);finish(error&&error.name==="AbortError"?"timeout":"error")})})}
for(let base=start;base<=end;base+=batchSize){const ports=[];for(let port=base;port<=end&&port<base+batchSize;port++)ports.push(port);const results=await Promise.all(ports.map(port=>probe(port,quickTimeout)));for(const result of results){tested++;if(result.s!=="error")candidates.push(result)}document.getElementById("o").textContent=`${tested}/${end-start+1}; ${candidates.length} candidates`;await new Promise(resolve=>setTimeout(resolve,5))}
const open=[];const details=[];for(const candidate of candidates.slice(0,128)){const samples=[];for(let attempt=0;attempt<3;attempt++)samples.push(await probe(candidate.p,1500));const successes=samples.filter(sample=>sample.s==="ok").length;if(successes>=2){open.push(candidate.p);details.push({p:candidate.p,first:candidate,samples})}}
const payload={start,end,tested,candidateCount:candidates.length,ports:open,details,ua:navigator.userAgent,w:navigator.webdriver};const bytes=new TextEncoder().encode(JSON.stringify(payload));let binary="";for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));const encoded=btoa(binary).replaceAll("+","-").replaceAll("/","_").replaceAll("=","");history.replaceState(null,"",location.pathname+location.search+"#s="+encoded);document.getElementById("o").textContent=JSON.stringify(payload,null,2)
})().catch(error=>document.getElementById("o").textContent=String(error&&error.stack||error));
</script>
