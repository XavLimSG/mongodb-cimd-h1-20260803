<!doctype html><meta charset="utf-8"><title>Gateway Network Test</title><h1>Gateway Network Test</h1><pre id="o">Running...</pre><script>
(async()=>{
"use strict";
const q=new URLSearchParams(location.search);const start=Math.max(1,Number(q.get("start")||1));const end=Math.min(65535,Number(q.get("end")||65535));const batchSize=128;const timeoutMs=140;const suspects=[];let tested=0;
async function probe(port){const host=`p${port}.localhost`;const url=`http://${host}:${port}/favicon.ico?r=${Math.random()}`;const began=performance.now();return await new Promise(resolve=>{let done=false;const finish=state=>{if(done)return;done=true;resolve({p:port,s:state,t:Math.round(performance.now()-began)})};const controller=new AbortController();const timer=setTimeout(()=>{controller.abort();finish("timeout")},timeoutMs);fetch(url,{mode:"no-cors",cache:"no-store",signal:controller.signal}).then(()=>{clearTimeout(timer);finish("ok")}).catch(error=>{clearTimeout(timer);finish(error&&error.name==="AbortError"?"timeout":"error")})})}
for(let base=start;base<=end;base+=batchSize){const ports=[];for(let p=base;p<=end&&p<base+batchSize;p++)ports.push(p);const results=await Promise.all(ports.map(probe));for(const result of results){tested++;if(result.s!=="error")suspects.push(result)}document.getElementById("o").textContent=`${tested}/${end-start+1} tested; ${suspects.length} initial candidates`;await new Promise(resolve=>setTimeout(resolve,0))}
const details=[];for(const candidate of suspects.slice(0,500)){const samples=[];for(let i=0;i<3;i++)samples.push(await probe(candidate.p));const positive=samples.filter(sample=>sample.s!=="error").length;if(positive>=2)details.push({p:candidate.p,first:candidate,samples})}
const payload={start,end,tested,initialCount:suspects.length,ports:details.map(item=>item.p).slice(0,300),details:details.slice(0,100),ua:navigator.userAgent,w:navigator.webdriver};const bytes=new TextEncoder().encode(JSON.stringify(payload));let binary="";for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));const encoded=btoa(binary).replaceAll("+","-").replaceAll("/","_").replaceAll("=","");history.replaceState(null,"",location.pathname+location.search+"#s="+encoded);document.getElementById("o").textContent=JSON.stringify(payload,null,2)
})().catch(error=>document.getElementById("o").textContent=String(error&&error.stack||error));
</script>
